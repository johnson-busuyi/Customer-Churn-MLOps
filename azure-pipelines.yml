
  # STAGE 3: AUTOMATIC GIT VERSIONING
  - stage: Version
    displayName: 'Automatic Git Versioning'
    dependsOn: Docker
    condition: >
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI')
      )

    jobs:
      - job: CreateGitTag
        displayName: 'Create Git and Docker Version Tags'

        steps:
          - checkout: self
            persistCredentials: true
            fetchDepth: 0

          # STEP 1: CREATE GIT VERSION TAG
          - script: |
              set -e

              VERSION="v1.0.$(Build.BuildId)"

              git config user.name "Azure DevOps"
              git config user.email "azure-pipelines@users.noreply.github.com"

              git tag -a "$VERSION" -m "Release $VERSION"

              AUTH_HEADER=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)

              git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" push origin "$VERSION"

              echo "Created Git tag: $VERSION"

            displayName: 'Create and Push Git Tag'
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)

          # STEP 2: PUBLISH VERSIONED DOCKER IMAGE
          - script: |
              set -e

              VERSION="v1.0.$(Build.BuildId)"
              IMAGE="$DOCKERHUB_USERNAME/$(DOCKER_REPO)"

              echo "$DOCKERHUB_TOKEN" | docker login \
                -u "$DOCKERHUB_USERNAME" \
                --password-stdin

              docker pull "$IMAGE:$(Build.SourceVersion)"

              docker tag "$IMAGE:$(Build.SourceVersion)" "$IMAGE:$VERSION"

              docker push "$IMAGE:$VERSION"

              docker logout

              echo "Published Docker image: $IMAGE:$VERSION"

            displayName: 'Publish Versioned Docker Image'
            env:
              DOCKERHUB_USERNAME: $(DOCKERHUB_USERNAME)
              DOCKERHUB_TOKEN: $(DOCKERHUB_TOKEN)
